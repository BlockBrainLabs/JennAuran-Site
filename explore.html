<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Macro Explorer | Fragments: Moments in Between</title>
<meta name="description" content="Deep-zoom into 46 to 73 megapixel macro photography by Jenn Auran. Dive until the detail resolves.">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/openseadragon/4.1.0/openseadragon.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#050506;--text:#e8e6e3;--text-dim:#7a7872;--text-muted:#4a4944;--accent:#c8a87c;--serif:'Playfair Display',Georgia,serif;--sans:'DM Sans',-apple-system,sans-serif;--mono:'JetBrains Mono',monospace}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);overflow:hidden}
.site-grain{position:fixed;inset:0;z-index:50;pointer-events:none;opacity:.015;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}
#viewer{position:absolute;inset:0;background:var(--bg)}
.topbar{position:fixed;top:0;left:0;right:0;z-index:60;display:flex;justify-content:space-between;align-items:center;padding:1.1rem 1.5rem;background:linear-gradient(to bottom,rgba(5,5,6,.87),transparent);pointer-events:none}
.topbar a,.topbar .label{pointer-events:auto}
.back{font-family:var(--serif);font-size:1.1rem;font-weight:700;color:var(--text);text-decoration:none}
.back span{color:var(--accent)}
.label{font-family:var(--mono);font-size:.6rem;letter-spacing:.3em;text-transform:uppercase;color:var(--text-dim)}
.info{position:fixed;left:1.5rem;bottom:7.5rem;z-index:60;max-width:420px;pointer-events:none}
.info h1{font-family:var(--serif);font-size:clamp(1.4rem,3.5vw,2.2rem);font-weight:400;line-height:1.15}
.info .mp{font-family:var(--mono);font-size:.6rem;letter-spacing:.25em;text-transform:uppercase;color:var(--accent);margin:.4rem 0 .5rem}
.info p{font-size:.85rem;font-weight:300;color:var(--text-dim);line-height:1.6;text-shadow:0 1px 8px rgba(0,0,0,.9)}
.controls{position:fixed;right:1.5rem;bottom:7.5rem;z-index:60;display:flex;flex-direction:column;gap:.6rem}
.ctl{width:44px;height:44px;border-radius:50%;border:1px solid rgba(200,168,124,.35);background:rgba(5,5,6,.65);backdrop-filter:blur(8px);color:var(--accent);font-size:1.2rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .3s;touch-action:manipulation}
.ctl:hover,.ctl:active{background:rgba(200,168,124,.15);border-color:var(--accent)}
.strip{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;gap:.6rem;padding:1rem 1.5rem 1.25rem;overflow-x:auto;background:linear-gradient(to top,rgba(5,5,6,.92),transparent);-webkit-overflow-scrolling:touch}
.strip::-webkit-scrollbar{display:none}
.thumb{flex:0 0 auto;width:86px;height:58px;border-radius:3px;overflow:hidden;cursor:pointer;border:1px solid rgba(255,255,255,.08);opacity:.55;transition:all .3s;touch-action:manipulation}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb.active{opacity:1;border-color:var(--accent);box-shadow:0 0 20px rgba(200,168,124,.25)}
.thumb:hover{opacity:.9}
.hint{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:55;font-family:var(--mono);font-size:.65rem;letter-spacing:.3em;text-transform:uppercase;color:var(--text-dim);background:rgba(5,5,6,.6);border:1px solid rgba(200,168,124,.2);padding:.8rem 1.4rem;border-radius:2px;pointer-events:none;transition:opacity 1s;backdrop-filter:blur(6px)}
.hint.gone{opacity:0}
.zoomread{position:fixed;top:4.2rem;right:1.5rem;z-index:60;font-family:var(--mono);font-size:.6rem;letter-spacing:.2em;color:var(--text-muted)}
@media(max-width:700px){.info{bottom:8.2rem;max-width:70vw}.info p{display:none}.controls{bottom:8.2rem;right:1rem}.ctl{width:40px;height:40px}}

/* ---- shared site nav ---- */
nav.pnav{position:fixed;top:0;left:0;right:0;z-index:100;padding:1.1rem 1.5rem;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(to bottom,rgba(5,5,6,.9),transparent)}
.nav-right{display:flex;align-items:center;gap:1.5rem}
.logo{font-family:var(--serif);font-size:1.25rem;font-weight:700;letter-spacing:-.02em;color:var(--text);cursor:pointer;text-decoration:none}
.logo span{color:var(--accent)}
.nav-links{display:flex;gap:2.5rem;list-style:none;align-items:center}
.nav-links a{font-family:var(--mono);font-size:.7rem;font-weight:300;letter-spacing:.15em;text-transform:uppercase;color:var(--text-dim);text-decoration:none;transition:color .3s;position:relative}
.nav-links a:hover,.nav-links a.active{color:var(--accent)}
.nav-links a.active::after{content:'';position:absolute;bottom:-6px;left:0;right:0;height:1px;background:var(--accent)}
.hamburger{display:none;flex-direction:column;gap:5px;cursor:pointer;background:none;border:none;padding:4px;z-index:101}
.hamburger span{width:24px;height:1.5px;background:var(--text);transition:all .3s;display:block}
.hamburger.open span:nth-child(1){transform:rotate(45deg) translate(4.5px,4.5px)}
.hamburger.open span:nth-child(2){opacity:0}
.hamburger.open span:nth-child(3){transform:rotate(-45deg) translate(4.5px,-4.5px)}
.mobile-menu{display:none;position:fixed;inset:0;z-index:99;background:rgba(4,4,5,.97);backdrop-filter:blur(30px);flex-direction:column;align-items:center;justify-content:center;gap:2rem}
.mobile-menu.open{display:flex}
.mobile-menu a{font-family:var(--serif);font-size:2rem;color:var(--text-dim);text-decoration:none;transition:color .3s}
.mobile-menu a:hover{color:var(--accent)}
@media(max-width:900px){.nav-links{display:none}.hamburger{display:flex}}
</style>
</head>
<body>
<div class="site-grain"></div>
<div id="viewer"></div>
<nav class="pnav"><a href="/" class="logo">fragments<span>.</span></a><div class="nav-right"><ul class="nav-links"><a href="/#home">home</a><a href="/#music">music</a><a href="/#gallery">gallery</a><a href="explore.html" class="active">explore</a><a href="visualize.html">visualize</a><a href="videos.html">videos</a><a href="/#about">about</a><a href="/#contact">contact</a></ul><button class="hamburger" id="hb"><span></span><span></span><span></span></button></div></nav><div class="mobile-menu" id="mm"><a href="/#home">home</a><a href="/#music">music</a><a href="/#gallery">gallery</a><a href="explore.html" class="active">explore</a><a href="visualize.html">visualize</a><a href="videos.html">videos</a><a href="/#about">about</a><a href="/#contact">contact</a></div>
<div class="zoomread" id="zr">1.0&times;</div>
<div class="info">
  <h1 id="ptitle"></h1>
  <div class="mp" id="pmp"></div>
  <p id="pdesc"></p>
</div>
<div class="controls">
  <button class="ctl" id="zin" title="Zoom in">+</button>
  <button class="ctl" id="zout" title="Zoom out">&minus;</button>
  <button class="ctl" id="zhome" title="Reset view" style="font-size:.9rem">&#8634;</button>
</div>
<div class="strip" id="strip"></div>
<div class="hint" id="hint">Scroll or pinch to dive in</div>
<script>
var PHOTOS=[
{slug:"beetle",t:"Longhorn Beetle",thumb:"thumbs/MACRO0010-InsectWhiteBlossoms.jpg",w:11500,h:6369,d:"The deepest dive in the gallery at 73 megapixels. Find the beetle among the petals, then keep going until the antennae fill the screen."},
{slug:"redrose",t:"Red Rose",thumb:"thumbs/MACRO0007-RedRoseCloseup.jpg",w:8000,h:5220,d:"Deep crimson folds at 42 megapixels. Dive until the velvet grain of the petals resolves."},
{slug:"yellowrose",t:"Yellow Rose",thumb:"thumbs/MACRO0014-YellowRoseCloseupWithDroplets.jpg",w:8000,h:5386,d:"Sunlit petals holding water. Every droplet is a tiny lens; go look through one."},
{slug:"bluerose",t:"Blue Rose",thumb:"thumbs/MACRO0017-PurpleBlueRoseCloseup.jpg",w:9027,h:5081,d:"46 megapixels of ultraviolet. The texture hides in the shadows between the petals."},
{slug:"tailedjay",t:"Tailed Jay",thumb:"thumbs/MACRO0012-GreenSpottedButterfly.jpg",w:6250,h:4174,d:"A Tailed Jay at rest. Zoom to the wing and watch the green mosaic become individual scales."}
];
var viewer=OpenSeadragon({
  id:"viewer",
  prefixUrl:"",
  showNavigationControl:false,
  tileSources:"zoom/"+PHOTOS[0].slug+".dzi",
  maxZoomPixelRatio:2,
  minZoomImageRatio:.85,
  visibilityRatio:.6,
  springStiffness:8,
  animationTime:1.4,
  gestureSettingsMouse:{clickToZoom:true,dblClickToZoom:true},
  crossOriginPolicy:"Anonymous",
  backgroundColor:"#050506"
});
var current=0,hinted=false;
function mp(p){return Math.round(p.w*p.h/1e6)}
function setInfo(i){
  document.getElementById("ptitle").textContent=PHOTOS[i].t;
  document.getElementById("pmp").textContent=PHOTOS[i].w.toLocaleString()+" \u00d7 "+PHOTOS[i].h.toLocaleString()+" \u00b7 "+mp(PHOTOS[i])+" megapixels";
  document.getElementById("pdesc").textContent=PHOTOS[i].d;
  document.querySelectorAll(".thumb").forEach(function(el,j){el.classList.toggle("active",j===i)});
}
var strip=document.getElementById("strip");
PHOTOS.forEach(function(p,i){
  var d=document.createElement("div");d.className="thumb"+(i===0?" active":"");
  d.innerHTML='<img src="'+p.thumb+'" alt="'+p.t+'" loading="lazy">';
  d.addEventListener("click",function(){if(current===i)return;current=i;viewer.open("zoom/"+p.slug+".dzi");setInfo(i)});
  strip.appendChild(d);
});
setInfo(0);
function dismissHint(){if(!hinted){hinted=true;document.getElementById("hint").classList.add("gone")}}
viewer.addHandler("zoom",function(e){
  dismissHint();
  var img=viewer.viewport.viewportToImageZoom(e.zoom);
  document.getElementById("zr").textContent=(Math.round(img*100)/100)+"\u00d7 native";
});
viewer.addHandler("canvas-drag",dismissHint);
document.getElementById("zin").addEventListener("click",function(){viewer.viewport.zoomBy(1.6);viewer.viewport.applyConstraints()});
document.getElementById("zout").addEventListener("click",function(){viewer.viewport.zoomBy(1/1.6);viewer.viewport.applyConstraints()});
document.getElementById("zhome").addEventListener("click",function(){viewer.viewport.goHome()});
setTimeout(dismissHint,6000);
</script>
<script>
(function(){var hb=document.getElementById("hb"),mm=document.getElementById("mm");
hb.addEventListener("click",function(){hb.classList.toggle("open");mm.classList.toggle("open")});
mm.querySelectorAll("a").forEach(function(a){a.addEventListener("click",function(){hb.classList.remove("open");mm.classList.remove("open")})});})();
</script>
</body>
</html>
