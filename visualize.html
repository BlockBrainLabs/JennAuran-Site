<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Visualizer | Fragments: Moments in Between</title>
<meta name="description" content="An audio-reactive visualizer for Fragments: Moments in Between. Twelve tracks, painted in light.">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#020203;--text:#e8e6e3;--text-dim:#7a7872;--text-muted:#4a4944;--accent:#c8a87c;--serif:'Playfair Display',Georgia,serif;--sans:'DM Sans',-apple-system,sans-serif;--mono:'JetBrains Mono',monospace}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.site-grain{position:fixed;inset:0;z-index:40;pointer-events:none;opacity:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}
.topbar{position:fixed;top:0;left:0;right:0;z-index:60;display:flex;justify-content:space-between;align-items:center;padding:1.1rem 1.5rem;background:linear-gradient(to bottom,rgba(2,2,3,.85),transparent)}
.back{font-family:var(--serif);font-size:1.1rem;font-weight:700;color:var(--text);text-decoration:none}
.back span{color:var(--accent)}
.listbtn{font-family:var(--mono);font-size:.6rem;letter-spacing:.3em;text-transform:uppercase;color:var(--text-dim);background:none;border:1px solid rgba(200,168,124,.25);padding:.55rem 1rem;cursor:pointer;transition:all .3s;border-radius:2px}
.listbtn:hover,.listbtn.open{color:var(--accent);border-color:var(--accent)}
.drawer{position:fixed;top:0;left:0;bottom:0;z-index:70;width:min(320px,85vw);background:rgba(4,4,6,.98);backdrop-filter:blur(20px);border-right:1px solid rgba(200,168,124,.12);transform:translateX(-100%);transition:transform .45s cubic-bezier(.16,1,.3,1);overflow-y:auto;padding:4.5rem 0 2rem}
.drawer.open{transform:translateX(0)}
.drawer .dh{font-family:var(--mono);font-size:.55rem;letter-spacing:.35em;text-transform:uppercase;color:var(--accent);padding:0 1.5rem 1rem}
.tr{display:flex;align-items:baseline;gap:.9rem;padding:.8rem 1.5rem;cursor:pointer;transition:background .2s;border-left:2px solid transparent}
.tr:hover{background:rgba(200,168,124,.05)}
.tr.on{border-left-color:var(--accent);background:rgba(200,168,124,.07)}
.tr .n{font-family:var(--mono);font-size:.65rem;color:var(--text-muted);width:20px;flex-shrink:0}
.tr.on .n{color:var(--accent)}
.tr .t{font-size:.85rem;font-weight:300;color:var(--text-dim);line-height:1.3}
.tr.on .t{color:var(--text)}
.hud{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;flex-direction:column;align-items:center;gap:.9rem;padding:1.5rem 1rem 2rem;background:linear-gradient(to top,rgba(2,2,3,.9),transparent);text-align:center}
.now{font-family:var(--mono);font-size:.5rem;letter-spacing:.4em;text-transform:uppercase;color:var(--text-muted)}
.tt{font-family:var(--serif);font-size:clamp(1.2rem,3.2vw,1.9rem);font-weight:400;line-height:1.2;max-width:90vw}
.btns{display:flex;align-items:center;gap:1.4rem;margin-top:.2rem}
.sk{background:none;border:none;color:var(--text-dim);cursor:pointer;padding:8px;transition:color .3s;touch-action:manipulation}
.sk:hover,.sk:active{color:var(--accent)}
.play{width:58px;height:58px;border-radius:50%;background:var(--accent);border:none;color:var(--bg);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .2s;touch-action:manipulation;box-shadow:0 0 34px rgba(200,168,124,.35)}
.play:active{transform:scale(.94)}
.scrim{position:fixed;inset:0;z-index:65;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .4s}
.scrim.show{opacity:1;pointer-events:auto}

/* ---- shared site nav ---- */
nav.pnav{position:fixed;top:0;left:0;right:0;z-index:100;padding:1.1rem 1.5rem;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(to bottom,rgba(2,2,3,.92),transparent)}
.nav-right{display:flex;align-items:center;gap:1.5rem}
.logo{font-family:var(--serif);font-size:1.25rem;font-weight:700;letter-spacing:-.02em;color:var(--text);cursor:pointer;text-decoration:none}
.logo span{color:var(--accent)}
.nav-links{display:flex;gap:2.5rem;list-style:none;align-items:center}
.nav-links a{font-family:var(--mono);font-size:.7rem;font-weight:300;letter-spacing:.15em;text-transform:uppercase;color:var(--text-dim);text-decoration:none;transition:color .3s;position:relative}
.nav-links a:hover,.nav-links a.active{color:var(--accent)}
.nav-links a.active::after{content:'';position:absolute;bottom:-6px;left:0;right:0;height:1px;background:var(--accent)}
.hamburger{display:none;flex-direction:column;gap:5px;cursor:pointer;background:none;border:none;padding:4px;z-index:101}
.hamburger span{width:24px;height:1.5px;background:var(--text);transition:all .3s;display:block}
.hamburger.open span:nth-child(1){transform:rotate(45deg) translate(4.5px,4.5px)}
.hamburger.open span:nth-child(2){opacity:0}
.hamburger.open span:nth-child(3){transform:rotate(-45deg) translate(4.5px,-4.5px)}
.mobile-menu{display:none;position:fixed;inset:0;z-index:99;background:rgba(2,2,3,.98);backdrop-filter:blur(30px);flex-direction:column;align-items:center;justify-content:center;gap:2rem}
.mobile-menu.open{display:flex}
.mobile-menu a{font-family:var(--serif);font-size:2rem;color:var(--text-dim);text-decoration:none;transition:color .3s}
.mobile-menu a:hover{color:var(--accent)}
@media(max-width:900px){.nav-links{display:none}.hamburger{display:flex}}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="site-grain"></div>
<nav class="pnav"><a href="/" class="logo">fragments<span>.</span></a><div class="nav-right"><ul class="nav-links"><a href="/#home">home</a><a href="/#music">music</a><a href="/#gallery">gallery</a><a href="explore.html">explore</a><a href="visualize.html" class="active">visualize</a><a href="videos.html">videos</a><a href="/#about">about</a><a href="/#contact">contact</a></ul><button class="listbtn" id="lb">Tracks</button><button class="hamburger" id="hb"><span></span><span></span><span></span></button></div></nav><div class="mobile-menu" id="mm"><a href="/#home">home</a><a href="/#music">music</a><a href="/#gallery">gallery</a><a href="explore.html">explore</a><a href="visualize.html" class="active">visualize</a><a href="videos.html">videos</a><a href="/#about">about</a><a href="/#contact">contact</a></div>
<div class="scrim" id="scrim"></div>
<div class="drawer" id="drawer"><div class="dh">Fragments: Moments in Between</div><div id="list"></div></div>
<div class="hud">
  <div class="now">Now Playing</div>
  <div class="tt" id="tt"></div>
  <div class="btns">
    <button class="sk" id="prev"><svg width="20" height="20" viewBox="0 0 16 16" fill="none" style="transform:scaleX(-1)"><path d="M3 2.5L10 8L3 13.5V2.5Z" fill="currentColor"/><rect x="11" y="2.5" width="2" height="11" rx=".5" fill="currentColor"/></svg></button>
    <button class="play" id="play"><svg width="22" height="22" viewBox="0 0 14 14" fill="none" id="pic"><path d="M3 1.5L12 7L3 12.5V1.5Z" fill="currentColor"/></svg></button>
    <button class="sk" id="next"><svg width="20" height="20" viewBox="0 0 16 16" fill="none"><path d="M3 2.5L10 8L3 13.5V2.5Z" fill="currentColor"/><rect x="11" y="2.5" width="2" height="11" rx=".5" fill="currentColor"/></svg></button>
  </div>
</div>
<script>
var K=[
{n:"01",t:"I Want Your Love (Not a Love Song)",f:"audio/I_Want_Your_Love__Not_a_Love_Song_.mp3"},
{n:"02",t:"Bloodrage",f:"audio/Bloodrage.mp3"},
{n:"03",t:"Goodbye, My Friend (Until We Meet Again)",f:"audio/Goodbye__My_Friend__Until_We_Meet_Again_.mp3"},
{n:"04",t:"Shine",f:"audio/Shine.mp3"},
{n:"05",t:"Those Hours",f:"audio/Those_Hours.mp3"},
{n:"06",t:"Finding My Way",f:"audio/Finding_My_Way.mp3"},
{n:"07",t:"What Dreams May Come",f:"audio/What_Dreams_May_Come.mp3"},
{n:"08",t:"Wonderful",f:"audio/Wonderful.mp3"},
{n:"09",t:"Sunflower Rain",f:"audio/Sunflower_Rain.mp3"},
{n:"10",t:"Feeling Like a Star",f:"audio/Feeling_Like_a_Star.mp3"},
{n:"11",t:"Countless Days",f:"audio/Countless_Days.mp3"},
{n:"12",t:"Craven",f:"audio/Craven.mp3"}
];
var au=new Audio(),ci=0,playing=false,ctx=null,analyser=null,freq=null;
au.preload="auto";
var playSvg='<path d="M3 1.5L12 7L3 12.5V1.5Z" fill="currentColor"/>';
var pauseSvg='<rect x="2.5" y="1.5" width="3" height="11" rx=".5" fill="currentColor"/><rect x="8.5" y="1.5" width="3" height="11" rx=".5" fill="currentColor"/>';

var list=document.getElementById("list");
K.forEach(function(k,i){
  var d=document.createElement("div");d.className="tr"+(i===0?" on":"");
  d.innerHTML='<span class="n">'+k.n+'</span><span class="t">'+k.t+'</span>';
  d.addEventListener("click",function(){load(i,true);toggleDrawer(false)});
  list.appendChild(d);
});
function markList(){document.querySelectorAll(".tr").forEach(function(el,j){el.classList.toggle("on",j===ci)})}
function ensureCtx(){
  if(ctx)return;
  ctx=new (window.AudioContext||window.webkitAudioContext)();
  var src=ctx.createMediaElementSource(au);
  analyser=ctx.createAnalyser();
  analyser.fftSize=4096;analyser.smoothingTimeConstant=.85;
  src.connect(analyser);analyser.connect(ctx.destination);
  freq=new Uint8Array(analyser.frequencyBinCount);
}
function load(i,andPlay){
  ci=(i+K.length)%K.length;
  au.src=K[ci].f;au.load();
  document.getElementById("tt").textContent=K[ci].t;
  markList();
  if("mediaSession" in navigator){navigator.mediaSession.metadata=new MediaMetadata({title:K[ci].t,artist:"Fragments: Moments in Between",album:"Fragments: Moments in Between"})}
  if(andPlay)start();
}
function start(){
  ensureCtx();
  if(ctx.state==="suspended")ctx.resume();
  au.play().then(function(){playing=true;document.getElementById("pic").innerHTML=pauseSvg}).catch(function(){});
}
function pause(){au.pause();playing=false;document.getElementById("pic").innerHTML=playSvg}
document.getElementById("play").addEventListener("click",function(){playing?pause():start()});
document.getElementById("prev").addEventListener("click",function(){if(au.currentTime>3){au.currentTime=0}else{load(ci-1,playing||true)}});
document.getElementById("next").addEventListener("click",function(){load(ci+1,true)});
au.addEventListener("ended",function(){load(ci+1,true)});
if("mediaSession" in navigator){
  navigator.mediaSession.setActionHandler("play",start);
  navigator.mediaSession.setActionHandler("pause",pause);
  navigator.mediaSession.setActionHandler("previoustrack",function(){load(ci-1,true)});
  navigator.mediaSession.setActionHandler("nexttrack",function(){load(ci+1,true)});
}
var drawer=document.getElementById("drawer"),scrim=document.getElementById("scrim"),lb=document.getElementById("lb");
function toggleDrawer(open){drawer.classList.toggle("open",open);scrim.classList.toggle("show",open);lb.classList.toggle("open",open)}
lb.addEventListener("click",function(){toggleDrawer(!drawer.classList.contains("open"))});
scrim.addEventListener("click",function(){toggleDrawer(false)});

// ---- canvas ----
var cv=document.getElementById("cv"),g=cv.getContext("2d"),W=0,H=0,DPR=1;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=cv.width=innerWidth*DPR;H=cv.height=innerHeight*DPR;g.fillStyle="#020203";g.fillRect(0,0,W,H)}
resize();addEventListener("resize",resize);
var BARS=84;
function draw(){
  requestAnimationFrame(draw);
  // trailing fade
  g.fillStyle="rgba(2,2,3,.22)";g.fillRect(0,0,W,H);
  if(!analyser){idle();return}
  analyser.getByteFrequencyData(freq);
  var usable=Math.floor(freq.length*.5),cy=H*.46,maxH=H*.34;
  var avg=0;
  var half=Math.floor(BARS/2),bw=W/(BARS+6);
  for(var i=0;i<half;i++){
    var bin=Math.floor(Math.pow(i/half,1.8)*usable);
    var v=freq[bin]/255;avg+=v;
    var bh=Math.max(2*DPR,v*v*maxH);
    var a=.25+v*.75;
    g.fillStyle="rgba(200,168,124,"+a.toFixed(3)+")";
    g.shadowColor="rgba(200,168,124,.8)";g.shadowBlur=14*DPR*v;
    var xr=W/2+ i*bw + bw*.15, xl=W/2-(i+1)*bw + bw*.15, w=bw*.7;
    g.fillRect(xr,cy-bh,w,bh*2);
    g.fillRect(xl,cy-bh,w,bh*2);
  }
  g.shadowBlur=0;
  avg/=half;
  // breathing halo
  var r=Math.max(W,H)*(.25+avg*.3);
  var grad=g.createRadialGradient(W/2,cy,0,W/2,cy,r);
  grad.addColorStop(0,"rgba(200,168,124,"+(avg*.06).toFixed(3)+")");
  grad.addColorStop(1,"rgba(200,168,124,0)");
  g.fillStyle=grad;g.fillRect(0,0,W,H);
}
var t0=Date.now();
function idle(){
  var t=(Date.now()-t0)/1000,cy=H*.46;
  for(var i=0;i<BARS;i++){
    var x=(i+.5)*(W/BARS);
    var v=(Math.sin(t*1.2+i*.35)+1)/2*.06+.02;
    var bh=v*H*.3;
    g.fillStyle="rgba(200,168,124,"+(0.12+v).toFixed(3)+")";
    g.fillRect(x-1.2*DPR,cy-bh,2.4*DPR,bh*2);
  }
}
load(0,false);
draw();
</script>
<script>
(function(){var hb=document.getElementById("hb"),mm=document.getElementById("mm");
hb.addEventListener("click",function(){hb.classList.toggle("open");mm.classList.toggle("open")});
mm.querySelectorAll("a").forEach(function(a){a.addEventListener("click",function(){hb.classList.remove("open");mm.classList.remove("open")})});})();
</script>
</body>
</html>
